<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify your email</title>
<style>
  /* Reuses the same theme tokens as public/index.html (the "blueSharp"
     default palette) so this standalone page still looks like it belongs
     to Passport Consumer, without pulling in the SPA's JS framework —
     see README/the spec for why this is a separate, much simpler file. */
  :root {
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --bg: #000000; --surface: #000000; --border: #ffffff;
    --text: #ffffff; --text-dim: #cccccc; --text-faint: #999999;
    --accent: #00e5ff; --accent-dim: #00b8cc; --accent-glow: rgba(0,229,255,0.25);
    --green: #00ff85; --red: #ff3b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--text); font-family: var(--sans);
    position: relative; overflow: hidden;
  }
  body::before {
    content: ''; position: absolute; inset: -20%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 30% 20%, var(--accent-glow), transparent 55%),
                radial-gradient(circle at 80% 80%, var(--accent-glow), transparent 45%);
    opacity: .8;
  }
  .card {
    position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 34px; width: 100%; max-width: 400px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .brandmark { display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 800; font-size: 20px; margin-bottom: 18px; }
  .brandmark .logo { width: 26px; height: 26px; flex-shrink: 0; }
  .brandmark .word span { color: var(--accent); }
  .spinner {
    width: 28px; height: 28px; margin: 8px auto 18px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon { width: 44px; height: 44px; margin: 4px auto 16px; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin: 0; }
  .state-ok h1 { color: var(--green); }
  .state-err h1 { color: var(--red); }
  a.btn {
    display: inline-block; margin-top: 20px; padding: 10px 18px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #001014;
    text-decoration: none; font-weight: 600; font-size: 13px;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brandmark">
    <svg class="logo" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="2" width="18" height="22" rx="2.5" fill="none" stroke="var(--text-dim)" stroke-width="1.6" opacity=".55"/>
      <circle cx="13" cy="10.3" r="3.2" fill="var(--accent)" opacity=".9"/>
      <path d="M8.3 18.6c1.15-1.7 2.8-2.5 4.7-2.5s3.55.8 4.7 2.5" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
    </svg>
    <span class="word">Passport <span>Consumer</span></span>
  </div>
  <div id="body">
    <div class="spinner"></div>
    <h1>Verifying your email…</h1>
    <p>One moment.</p>
  </div>
</div>
<script>
'use strict';
// Deliberately no SPA framework here — this page only ever does one
// thing: read ?token= from the URL, call the confirm endpoint, and show
// a success or failure state. See src/routes/verifyEmail.js for the
// (also public, no login/app-credentials required) endpoint this calls.
(async function () {
  const body = document.getElementById('body');
  const card = document.getElementById('card');

  function showState(kind, title, message, showRetryHint) {
    card.classList.add('state-' + kind);
    const okIcon = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>';
    const errIcon = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    body.innerHTML = (kind === 'ok' ? okIcon : errIcon) +
      '<h1></h1><p></p>' +
      (showRetryHint ? '<a class="btn" href="/">Go to sign in</a>' : '');
    body.querySelector('h1').textContent = title;
    body.querySelector('p').textContent = message;
  }

  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    showState('err', 'Missing verification link', 'This page needs a verification link from your email — please use the link exactly as it was sent.', false);
    return;
  }

  try {
    const res = await fetch('/verify-email/confirm?token=' + encodeURIComponent(token));
    const data = await res.json().catch(() => ({}));
    if (data && data.ok) {
      showState('ok', 'Email verified', 'Your email address is confirmed. You can now sign in to any app connected to Passport Consumer.', true);
    } else {
      showState('err', 'Verification failed', (data && data.error) || 'This link is invalid or has expired. Ask the app you signed up with to send a new one.', true);
    }
  } catch (e) {
    showState('err', 'Something went wrong', 'Could not reach the server to verify this link. Please try again in a moment.', true);
  }
})();
</script>
</body>
</html>
