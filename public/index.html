/* ---------------- activity tab (admin only) ---------------- */
async function renderActivity(content) {
  const categories = await api('/activity/categories');
  content.innerHTML = '';

  const categorySelect = el('select', {}, [
    el('option', { value: '', text: 'All categories' }),
    ...categories.map((c) => el('option', { value: c, text: c })),
  ]);
  const actorInput = el('input', { type: 'text', placeholder: 'e.g. aledeaux' });
  const fromInput = el('input', { type: 'date' });
  const toInput = el('input', { type: 'date' });
  const activityTableWrap = el('div', {});

  function buildQuery(extra) {
    const params = new URLSearchParams();
    if (categorySelect.value) params.set('category', categorySelect.value);
    if (actorInput.value) params.set('actor', actorInput.value);
    if (fromInput.value) params.set('from', new Date(fromInput.value).toISOString());
    if (toInput.value) params.set('to', new Date(toInput.value + 'T23:59:59').toISOString());
    Object.entries(extra || {}).forEach(([k, v]) => params.set(k, v));
    return params.toString();
  }

  async function applyFilters() {
    const activity = await api('/activity?' + buildQuery());
    activityTableWrap.innerHTML = '';
    activityTableWrap.appendChild(tableWrap(el('table', {}, [
      el('thead', {}, [el('tr', {}, ['When', 'Category', 'Actor', 'Message'].map((h) => el('th', { text: h })))]),
      el('tbody', {}, activity.length ? activity.map((a) => el('tr', {}, [
        el('td', { style: 'width:150px', text: new Date(a.created_at).toLocaleString() }),
        el('td', {}, [el('span', { class: 'badge', text: a.category })]),
        el('td', { text: a.actor_username || '—' }),
        el('td', { text: a.message }),
      ])) : [el('tr', {}, [el('td', { colspan: '4', class: 'empty-note', text: 'No activity matches these filters.' })])]),
    ])));
  }

  function exportCsv() {
    window.open('/api/activity/export?' + buildQuery(), '_blank');
  }

  [categorySelect, actorInput, fromInput, toInput].forEach((el2) => el2.addEventListener('change', applyFilters));
  actorInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyFilters(); });

  const [, failedLogins] = await Promise.all([applyFilters(), api('/failed-logins')]);

  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('activity'), el('span', { text: 'Activity' })]),
    el('div', { class: 'pagesub', text: 'What’s happened across Passport Consumer recently.' }),

    el('div', { class: 'filter-bar' }, [
      el('div', { class: 'fgroup' }, [el('label', { text: 'Category' }), categorySelect]),
      el('div', { class: 'fgroup' }, [el('label', { text: 'Actor' }), actorInput]),
      el('div', { class: 'fgroup' }, [el('label', { text: 'From' }), fromInput]),
      el('div', { class: 'fgroup' }, [el('label', { text: 'To' }), toInput]),
      el('button', { class: 'btn-ghost', text: 'Apply', onclick: applyFilters }),
      el('button', { class: 'btn-ghost', text: 'Export CSV', onclick: exportCsv }, [icon('download')]),
    ]),

    el('div', { class: 'panel' }, [activityTableWrap]),

    el('h2', { style: 'margin-top:8px' }, [icon('key'), el('span', { text: 'Failed sign-ins' })]),
    el('div', { class: 'panel' }, [
      tableWrap(el('table', {}, [
        el('thead', {}, [el('tr', {}, ['When', 'Username', 'IP', 'Reason'].map((h) => el('th', { text: h })))]),
        el('tbody', {}, failedLogins.map((f) => el('tr', {}, [
          el('td', { style: 'width:150px', text: new Date(f.created_at).toLocaleString() }),
          el('td', { text: f.username || '—' }),
          el('td', { text: f.ip || '—' }),
          el('td', {}, [el('span', { class: 'badge ' + (f.reason === 'disabled' ? 'disabled' : 'warn'), text: f.reason || '—' })]),
        ]))),
      ])),
    ]),
  ]));
}

    catch (e) { toast(e.message, 'err'); }
  } });
  const editBtn = el('button', { class: 'btn-ghost btn-sm', text: 'Edit', onclick: () => openPolicyRuleModal(r, null) });
  const deleteBtn = el('button', { class: 'btn-danger btn-sm', text: 'Delete', onclick: async () => {
    if (!confirm(`Delete the "${r.label}" rule?`)) return;
    try { await api('/password-policy/' + r.id, { method: 'DELETE' }); renderPasswordPolicy(document.getElementById('content')); }
    catch (e) { toast(e.message, 'err'); }
  } });
  return el('tr', {}, [
    el('td', { text: r.label }),
    el('td', {}, [el('span', { class: 'badge', style: 'font-family:var(--mono)', text: r.type })]),
    el('td', { style: 'font-family:var(--mono);font-size:11px', text: JSON.stringify(r.params) }),
    el('td', {}, [el('span', { class: 'badge ' + (r.enabled ? 'ok' : 'disabled'), text: r.enabled ? 'enabled' : 'disabled' })]),
    el('td', { class: 'row-actions' }, [toggle, editBtn, deleteBtn]),
  ]);
}

/** New rules are created from a chosen TYPE (see src/utils/passwordPolicy.js) with a JSON params blob — kept as raw JSON here rather than one bespoke form per type, since the whole point is that new types shouldn't need new UI. */
function openPolicyRuleModal(rule, ruleTypes) {
  const isNew = !rule;
  const type = isNew
    ? el('select', {}, ruleTypes.map((t) => el('option', { value: t, text: t })))
    : el('input', { type: 'text', value: rule.type, disabled: 'disabled' });
  const label = el('input', { type: 'text', value: rule ? rule.label : '', placeholder: 'e.g. 2 symbols minimum' });
  const params = el('textarea', { rows: '4', style: 'font-family:var(--mono);font-size:12px' });
  params.value = JSON.stringify(rule ? rule.params : {}, null, 2);
  const errEl = el('div', { class: 'err' });

  async function submit() {
    errEl.textContent = '';
    let parsedParams;
    try { parsedParams = JSON.parse(params.value || '{}'); } catch (e) { errEl.textContent = 'Params must be valid JSON.'; return; }
    try {
      if (isNew) {
        await api('/password-policy', { method: 'POST', body: { type: type.value, label: label.value, params: parsedParams } });
        toast('Rule created', 'ok');
      } else {
        await api('/password-policy/' + rule.id, { method: 'PATCH', body: { label: label.value, params: parsedParams } });
        toast('Rule updated', 'ok');
      }
      closeModal();
      renderPasswordPolicy(document.getElementById('content'));
    } catch (e) { errEl.textContent = e.message; }
  }

  openModal([
    el('h3', {}, [icon('policy'), el('span', { text: isNew ? 'New password rule' : 'Edit password rule' })]),
    el('label', { text: 'Type' }), type,
    el('label', { text: 'Label (shown to users when this rule fails)' }), label,
    el('label', { text: 'Params (JSON)' }), params,
    errEl,
    el('div', { class: 'modal-actions' }, [
      el('div', { class: 'right' }, [
        el('button', { class: 'btn-ghost', text: 'Cancel', onclick: closeModal }),
        el('button', { class: 'btn-primary', text: isNew ? 'Create' : 'Save', onclick: submit }),
      ]),
    ]),
  ]);
}

/* ---------------- email / SMTP tab (admin only) ---------------- */
async function renderEmailSettings(content) {
  const settings = await api('/email-settings');
  content.innerHTML = '';

  const enabled = el('input', { type: 'checkbox' }); enabled.checked = settings.enabled;
  const host = el('input', { type: 'text', value: settings.host || '', placeholder: 'smtp.example.com' });
  const port = el('input', { type: 'number', value: settings.port || 587 });
  const secure = el('input', { type: 'checkbox' }); secure.checked = settings.secure;
  const username = el('input', { type: 'text', value: settings.username || '' });
  const password = el('input', { type: 'password', placeholder: settings.hasPassword ? '•••••••• (unchanged)' : 'SMTP password' });
  const fromAddress = el('input', { type: 'text', value: settings.fromAddress || '', placeholder: 'noreply@example.com' });
  const fromName = el('input', { type: 'text', value: settings.fromName || 'Passport Consumer' });
  const errEl = el('div', { class: 'err' });

  async function save() {
    errEl.textContent = '';
    try {
      const body = { enabled: enabled.checked, host: host.value, port: port.value, secure: secure.checked, username: username.value, fromAddress: fromAddress.value, fromName: fromName.value };
      if (password.value) body.password = password.value;
      await api('/email-settings', { method: 'PUT', body });
      toast('Email settings saved', 'ok');
      renderEmailSettings(content);
    } catch (e) { errEl.textContent = e.message; }
  }

  const testTo = el('input', { type: 'text', placeholder: 'you@example.com (optional — defaults to your own account email)' });
  async function sendTest() {
    try {
      await api('/email-settings/test', { method: 'POST', body: { to: testTo.value || undefined } });
      toast('Test email sent', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  }

  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('email'), el('span', { text: 'Email' })]),
    el('div', { class: 'pagesub', text: 'SMTP settings Passport Consumer uses to send account notifications (verification links, password changes, expiry warnings, unknown sign-ins, and more).' }),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('email'), el('span', { text: 'SMTP server' })]),
      el('label', { style: 'display:flex;align-items:center;gap:8px;font-weight:400' }, [enabled, el('span', { text: 'Enabled' })]),
      el('label', { text: 'Host' }), host,
      el('label', { text: 'Port' }), port,
      el('label', { style: 'display:flex;align-items:center;gap:8px;font-weight:400' }, [secure, el('span', { text: 'Use TLS' })]),
      el('label', { text: 'Username' }), username,
      el('label', { text: 'Password' }), password,
      el('label', { text: 'From address' }), fromAddress,
      el('label', { text: 'From name' }), fromName,
      errEl,
      el('button', { class: 'btn-primary', text: 'Save', style: 'margin-top:14px', onclick: save }),
    ]),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('activity'), el('span', { text: 'Send a test email' })]),
      testTo,
      el('button', { class: 'btn-ghost btn-sm', text: 'Send test', style: 'margin-top:10px', onclick: sendTest }),
    ]),
  ]));
}

/* ---------------- settings tab (admin only, site branding) ---------------- */
async function renderSettings(content) {
  const branding = await api('/branding');
  content.innerHTML = '';

  const siteName = el('input', { type: 'text', value: branding.siteName, maxlength: '60' });
  async function saveName() {
    try {
      const settings = await api('/branding', { method: 'PUT', body: { siteName: siteName.value } });
      state.branding = settings;
      state.brandingV = (state.brandingV || 0) + 1;
      toast('Site name updated', 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
  }

  const logoFile = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp', style: 'display:none' });
  const logoPreview = branding.logoExt
    ? el('img', { class: 'logo-preview', src: `/branding/logo.${branding.logoExt}?v=${Date.now()}`, alt: '' })
    : el('div', { class: 'logo-preview', style: 'display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:11px', text: 'None' });

  logoFile.addEventListener('change', async () => {
    if (!logoFile.files[0]) return;
    const fd = new FormData();
    fd.append('logo', logoFile.files[0]);
    try {
      const { settings } = await api('/branding/logo', { method: 'POST', body: fd });
      state.branding = settings;
      state.brandingV = (state.brandingV || 0) + 1;
      toast('Logo updated', 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
  });

  async function removeLogo() {
    try {
      const { settings } = await api('/branding/logo', { method: 'DELETE' });
      state.branding = settings;
      toast('Logo removed', 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
  }

  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('settings'), el('span', { text: 'Settings' })]),
    el('div', { class: 'pagesub', text: 'Branding shown on the login screen and header, for every app connected to Passport Consumer.' }),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('account'), el('span', { text: 'Site name' })]),
      siteName,
      el('button', { class: 'btn-primary', text: 'Save', style: 'margin-top:14px', onclick: saveName }),
    ]),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('upload'), el('span', { text: 'Logo' })]),
      el('div', { style: 'display:flex;align-items:center;gap:16px' }, [
        logoPreview,
        el('div', {}, [
          el('button', { class: 'btn-ghost btn-sm', text: branding.logoExt ? 'Replace logo' : 'Upload logo', onclick: () => logoFile.click() }),
          branding.logoExt ? el('button', { class: 'btn-ghost btn-sm', text: 'Remove', style: 'margin-left:8px', onclick: removeLogo }) : null,
        ]),
      ]),
      logoFile,
      el('div', { class: 'hint', text: 'PNG, JPEG, or WEBP, up to 1MB. Falls back to the default Passport Consumer mark if not set.' }),
    ]),
  ]));
}

/* ---------------- modal helper ---------------- */
function openModal(children) {
  closeModal();
  const backdrop = el('div', { class: 'modal-backdrop', id: 'modal-backdrop' }, [el('div', { class: 'modal' }, children)]);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  document.body.appendChild(backdrop);
}
function closeModal() {
  const existing = document.getElementById('modal-backdrop');
  if (existing) existing.remove();
}

boot();
</script>
